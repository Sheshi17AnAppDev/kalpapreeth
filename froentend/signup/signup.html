<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Kalpa Preeth</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/kp2.1.png" type="image/png" />
  <link rel="stylesheet" href="signup.css" />
</head>

<body>
  <div class="background-animation">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    <div class="floating-shape shape-4"></div>
  </div>

  <div class="signup-container">
    <div class="card-glow"></div>

    <div class="brand-section">
      <div class="brand-logo">
        <img src="/assets/kp2.1.png" alt="Kalpa Preeth Logo" class="logo-icon" />
        <span>Kalpa Preeth</span>
      </div>
      <div class="signup-title">Create Your Account</div>
      <div class="signup-desc">Join Kalpa Preeth and explore the future</div>
    </div>

    <!-- Step 1: Signup Form -->
    <form id="signupForm" autocomplete="off">
      <div class="form-step" id="step1">
        <div class="input-group">
          <div class="input-field">
            <input type="text" id="fullname" name="fullname" required />
            <label for="fullname">Full Name</label>
            <div class="input-underline"></div>
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor"
                  stroke-width="2" />
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
              </svg>
            </div>
          </div>

          <div class="input-field">
            <input type="email" id="email" name="email" required />
            <label for="email">Email Address</label>
            <div class="input-underline"></div>
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" stroke-width="2" />
                <path d="M2 7L12 13L22 7" stroke="currentColor" stroke-width="2" />
              </svg>
            </div>
          </div>

          <div class="input-field">
            <input type="password" id="password" name="password" required />
            <label for="password">Password</label>
            <div class="input-underline"></div>
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="10" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2" />
                <circle cx="12" cy="15" r="1" fill="currentColor" />
                <path d="M8 10V6C8 3.79086 9.79086 2 12 2C14.2091 2 16 3.79086 16 6V10" stroke="currentColor"
                  stroke-width="2" />
              </svg>
            </div>
            <button class="toggle-pw" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor"
                  stroke-width="2" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
          </div>

          <div class="input-field">
            <input type="password" id="confirm-password" name="confirm-password" required />
            <label for="confirm-password">Confirm Password</label>
            <div class="input-underline"></div>
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <rect x="3" y="10" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M8 10V6C8 3.79086 9.79086 2 12 2C14.2091 2 16 3.79086 16 6V10" stroke="currentColor"
                  stroke-width="2" />
              </svg>
            </div>
            <button class="toggle-pw" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor"
                  stroke-width="2" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
          </div>

          <!-- Role Selection -->
          <div class="input-field">
            <select id="role" name="role" required
              style="width: 100%; background: rgba(255,255,255,0.05); color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 10px; cursor: pointer; outline: none;">
              <option value="" disabled selected>Select Your Role</option>
              <option value="client">Client (Hiring)</option>
              <option value="talent">Talent (IT Professional)</option>
            </select>
            <div class="input-underline"></div>
          </div>

          <!-- Dynamic Talent Fields -->
          <div id="talent-specs" style="display: none; margin-top: 20px;">
            <h4 style="color: #00ff9d; margin-bottom: 15px; font-size: 0.9rem;">Professional Details</h4>
            <div class="input-field">
              <input type="text" id="talent-title" placeholder="e.g. Senior Full Stack Developer" />
              <label for="talent-title">Professional Title</label>
              <div class="input-underline"></div>
            </div>
            <div class="input-field">
              <input type="text" id="talent-skills" placeholder="e.g. React, Node, Python (comma separated)" />
              <label for="talent-skills">Skills</label>
              <div class="input-underline"></div>
            </div>
            <div class="input-field">
              <input type="text" id="talent-experience" placeholder="e.g. 5 Years" />
              <label for="talent-experience">Experience</label>
              <div class="input-underline"></div>
            </div>
          </div>

          <!-- Dynamic Client Fields -->
          <div id="client-specs" style="display: none; margin-top: 20px;">
            <h4 style="color: #00ff9d; margin-bottom: 15px; font-size: 0.9rem;">Client Details</h4>
            <div class="input-field">
              <input type="text" id="client-company" placeholder="e.g. Acme Corp" />
              <label for="client-company">Company / Organization</label>
              <div class="input-underline"></div>
            </div>
          </div>
        </div>

        <div class="password-strength">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText">Password strength</div>
        </div>

        <div class="terms-agreement">
          <label class="checkbox-container">
            <input type="checkbox" id="terms" name="terms" required />
            <span class="checkmark"></span>
            I agree to the
            <a href="#" class="terms-link">Terms of Service</a> and
            <a href="#" class="terms-link">Privacy Policy</a>
          </label>
        </div>

        <button type="button" class="gradient-btn" id="sendOtpBtn">
          <span class="btn-text">Send OTP</span>
          <div class="btn-loader"></div>
        </button>
      </div>

      <!-- Step 2: OTP Verification Form -->
      <div class="form-step" id="step2" style="display: none">
        <div class="otp-header">
          <h3>Verify Your Email</h3>
          <p>We've sent a 6-digit OTP to <span id="verifyEmail"></span></p>
        </div>

        <div class="input-group">
          <div class="input-field">
            <input type="text" id="otp" name="otp" maxlength="6" placeholder="000000" required />
            <label for="otp">One-Time Password</label>
            <div class="input-underline"></div>
          </div>
        </div>

        <div class="otp-timer">
          <span>OTP expires in: <span id="timer">10:00</span></span>
          <button type="button" class="resend-btn" id="resendOtpBtn">
            Resend OTP
          </button>
        </div>

        <button type="submit" class="gradient-btn" id="verifyOtpBtn">
          <span class="btn-text">Verify & Create Account</span>
          <div class="btn-loader"></div>
        </button>
      </div>

      <div class="login-section">
        <span>Already have an account?</span>
        <a href="/login" class="login-link">Log In</a>
      </div>
    </form>
  </div>

  <script src="signup.js"></script>
</body>

</html>
