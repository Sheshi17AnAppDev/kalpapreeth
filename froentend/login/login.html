<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Kalpa Preeth</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/kp2.1.png" type="image/png" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="background-animation">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>

  <div class="login-container">
    <div class="card-glow"></div>

    <div class="brand-section">
      <div class="brand-logo">
        <img src="/assets/kp2.1.png" alt="Kalpa Preeth Logo" class="logo-icon" />
        <span>Kalpa Preeth</span>
      </div>
      <div class="login-title">Access Your Account</div>
      <div class="login-desc">Welcome back to the future</div>
    </div>

    <form id="loginForm">
      <!-- Step 1: Login Form -->
      <div class="form-step" id="step1">
        <div class="input-group">
          <div class="input-field">
            <input type="text" id="email" name="email" required />
            <label for="email">Email / Username</label>
            <div class="input-underline"></div>
          </div>

          <div class="input-field">
            <input type="password" id="password" name="password" required />
            <label for="password">Password</label>
            <div class="input-underline"></div>
            <button class="toggle-pw" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor"
                  stroke-width="2" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember" name="remember" />
            <span class="checkmark"></span>
            Remember Me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="gradient-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <div class="btn-loader"></div>
        </button>

        <div style="text-align: center; margin-top: 15px;">
          <button type="button" id="useOtpLink"
            style="background:none; border:none; color: #00ff9d; cursor:pointer; font-size: 0.9rem;">Login with OTP
            instead</button>
        </div>
      </div>

      <!-- Step 2: OTP Verification Form -->
      <div class="form-step" id="step2" style="display: none">
        <div class="otp-header">
          <h3>Verify Your Identity</h3>
          <p>We've sent a 6-digit OTP to <span id="verifyEmail"></span></p>
        </div>

        <div class="input-group">
          <div class="input-field">
            <input type="text" id="otp" name="otp" maxlength="6" placeholder="000000" />
            <label for="otp">One-Time Password</label>
            <div class="input-underline"></div>
          </div>
        </div>

        <div class="otp-timer">
          <span>OTP expires in: <span id="timer">10:00</span></span>
          <button type="button" class="resend-btn" id="resendOtpBtn">
            Resend OTP
          </button>
        </div>

        <button type="submit" class="gradient-btn" id="verifyOtpBtn">
          <span class="btn-text">Verify & Login</span>
          <div class="btn-loader"></div>
        </button>

        <div style="text-align: center; margin-top: 15px;">
          <button type="button" onclick="location.reload()"
            style="background:none; border:none; color: #888; cursor:pointer; font-size: 0.8rem;">Go Back to Password
            Login</button>
        </div>
      </div>

      <div class="signup-section">
        <span>Don't have an account?</span>
        <a href="/signup" class="signup-link">Sign Up</a>
      </div>
    </form>
  </div>

  <script src="login.js"></script>
</body>

</html>
